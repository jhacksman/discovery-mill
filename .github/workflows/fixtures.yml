name: fixtures
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify-corpus:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: poppler (best effort; verifier SKIPs pdf checks if unavailable)
        continue-on-error: true
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-dejavu-core && break; sleep 20; done
      - run: pip install "pillow>=10"
      - run: python3 scripts/fixtures/verify_corpus.py
