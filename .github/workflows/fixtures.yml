name: fixtures
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify-corpus:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: poppler (best effort; verifier SKIPs pdf checks if unavailable)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq poppler-utils fonts-dejavu-core
      - run: pip install "pillow>=10"
      - run: python3 scripts/fixtures/verify_corpus.py
